<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé Or Royal Akeva Sérénité -->
    <linearGradient id="asGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD"/>
      <stop offset="25%" stop-color="#E5BE6C"/>
      <stop offset="55%" stop-color="#C99856"/>
      <stop offset="85%" stop-color="#A57A22"/>
      <stop offset="100%" stop-color="#7B530E"/>
    </linearGradient>

    <!-- Dégradé Or Doux pour le fond et les reflets -->
    <linearGradient id="asGoldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99856"/>
      <stop offset="50%" stop-color="#FDF3CD"/>
      <stop offset="100%" stop-color="#B88628"/>
    </linearGradient>

    <!-- Dégradé Feuille Dorée -->
    <linearGradient id="asLeafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE8A8"/>
      <stop offset="40%" stop-color="#D4A359"/>
      <stop offset="80%" stop-color="#A2731C"/>
      <stop offset="100%" stop-color="#6E4A0A"/>
    </linearGradient>

    <!-- Ombre subtile -->
    <filter id="asDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#asDropShadow)">
    <!-- 1. Cercle / Anneau Doré Extérieur -->
    <circle cx="250" cy="245" r="215" fill="none" stroke="url(#asGoldGrad)" stroke-width="7.5" stroke-linecap="round"/>

    <!-- 2. Étoile / Croix Royale à 4 branches surmontant le S -->
    <path d="M 285 72 
             C 285 86 280 92 268 95 
             C 280 98 285 104 285 118 
             C 285 104 290 98 302 95 
             C 290 92 285 86 285 72 Z"
          fill="url(#asGoldGrad)"/>

    <!-- 3. Monogramme "AS" Interlacé Majestueux -->
    
    <!-- Lettre A (Serif Classique Impérial) -->
    <g fill="url(#asGoldGrad)">
      <!-- Fût gauche fin du A avec empattement au sol -->
      <path d="M 226 95 L 142 360 L 120 364 L 120 376 L 180 376 L 180 364 L 158 360 L 202 225 L 255 225 L 265 255 L 210 255 L 220 225 L 226 95 Z"/>
      
      <!-- Fût droit plein / épais du A avec empattement au sol -->
      <path d="M 226 95 L 248 95 L 305 355 L 325 360 L 325 376 L 262 376 L 262 364 L 284 360 L 252 255 L 215 255 L 226 95 Z"/>

      <!-- Barre transversale fine du A -->
      <path d="M 182 265 L 270 265 L 266 277 L 178 277 Z"/>
      
      <!-- Empattement supérieur du A (Serif sommet) -->
      <path d="M 215 95 C 215 90 220 85 230 85 C 240 85 245 90 245 95 Z"/>
    </g>

    <!-- Lettre S (Serif Entrelacé en Or Éclatant) -->
    <g fill="url(#asGoldSoft)">
      <!-- Trajectoire fluide et élégante de la lettre S -->
      <path d="M 330 162 
               C 322 152 308 142 288 142 
               C 264 142 245 158 245 180 
               C 245 204 262 218 288 232 
               C 324 250 348 272 348 306 
               C 348 348 312 380 265 380 
               C 238 380 216 368 205 354 
               L 214 340 
               C 225 354 244 364 265 364 
               C 298 364 326 340 326 306 
               C 326 278 306 260 275 244 
               C 242 226 225 206 225 180 
               C 225 145 256 126 288 126 
               C 310 126 328 136 340 148 Z"/>

      <!-- Empattement terminal supérieur droit du S -->
      <path d="M 326 142 L 350 148 L 340 175 L 328 155 Z"/>

      <!-- Empattement terminal inférieur gauche du S -->
      <path d="M 205 354 L 216 326 L 228 348 L 210 358 Z"/>
    </g>

    <!-- 4. Feuille Botanique Dorée Délicate (Symbole de Vie et Sérénité) -->
    <g transform="translate(0, 0)">
      <!-- Corps de la feuille -->
      <path d="M 52 312 
               C 70 340 102 380 152 422 
               C 178 444 208 456 238 450 
               C 202 444 165 425 132 396 
               C 92 360 68 328 52 312 Z"
            fill="url(#asLeafGrad)"/>
            
      <!-- Moitié supérieure / galbée de la feuille -->
      <path d="M 52 312 
               C 85 320 140 342 188 388 
               C 224 422 238 450 238 450 
               C 215 448 185 432 152 405 
               C 105 365 72 334 52 312 Z"
            fill="url(#asGoldGrad)"/>

      <!-- Nervure centrale fine de la feuille -->
      <path d="M 54 314 
               C 100 350 155 395 234 448" 
            fill="none" stroke="#6E4A0A" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>
</svg>
