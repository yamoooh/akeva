<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Dégradés Or 3D Métallique Réaliste & Poli -->
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="15%" stop-color="#FCE5A2"/>
      <stop offset="35%" stop-color="#E5BA64"/>
      <stop offset="65%" stop-color="#C58D33"/>
      <stop offset="85%" stop-color="#915F13"/>
      <stop offset="100%" stop-color="#5E3B06"/>
    </linearGradient>

    <linearGradient id="goldSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805210"/>
      <stop offset="25%" stop-color="#DDA94B"/>
      <stop offset="50%" stop-color="#FFF4CE"/>
      <stop offset="75%" stop-color="#E2B45A"/>
      <stop offset="100%" stop-color="#9C6B1B"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFEAA8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D09838" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="goldHaloGlow" cx="62%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F2C868" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#C68E2D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8E5E14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="50%" stop-color="#DCA446"/>
      <stop offset="100%" stop-color="#8C5C12"/>
    </linearGradient>

    <!-- Ombre portée douce & relief 4K -->
    <filter id="luxuryDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#luxuryDropShadow)" transform="translate(10, 5)">
    <!-- 1. CERCLE / HALO EXTÉRIEUR ÉLÉGANT -->
    <path d="M 285 75 
             C 380 40 480 80 505 180 
             C 525 255 490 335 440 375" 
          fill="none" 
          stroke="url(#goldSwoosh)" 
          stroke-width="5" 
          stroke-linecap="round"/>

    <!-- 2. JAMBE GAUCHE ET SOMMET DU 'A' MAJESTUEUX -->
    <!-- Empattement inférieur gauche du A -->
    <path d="M 180 370 
             C 192 370 205 365 212 350 
             L 282 120 
             C 285 110 292 105 300 105 
             C 308 105 315 110 318 120 
             L 345 210 
             C 335 215 320 230 310 245 
             L 298 165 
             L 235 348 
             C 240 365 252 370 268 370 
             L 180 370 Z" 
          fill="url(#goldStem)"/>

    <!-- Biseau lumineux jambe gauche du A -->
    <path d="M 282 120 
             L 235 348 
             C 230 330 245 280 265 220 
             L 290 140 Z" 
          fill="url(#goldShine)"/>

    <!-- 3. RUBAN VOLUPTUEUX EN BOUCLE DU 'A' VERS LE 'S' -->
    <path d="M 200 305 
             C 225 255 285 240 335 280 
             C 390 325 435 385 380 375 
             C 330 365 280 305 245 285 
             C 220 272 208 288 200 305 Z" 
          fill="url(#goldSwoosh)"/>

    <!-- Ligne de reflet sur le ruban -->
    <path d="M 215 295 
             C 245 260 300 255 345 290 
             C 380 320 415 365 375 365 
             C 340 360 295 315 260 295 Z" 
          fill="url(#goldShine)" opacity="0.6"/>

    <!-- 4. GRAND 'S' EMBLÉMATIQUE AVEC VOLUTES POLIES -->
    <!-- Sommet et empattement du S -->
    <path d="M 435 125 
             L 485 125 
             L 485 180 
             C 475 160 460 145 440 140 
             C 400 130 360 160 350 200 
             C 340 245 375 285 415 315 
             C 460 350 475 390 440 420 
             C 405 450 330 440 300 395 
             L 315 375 
             C 340 415 395 425 425 400 
             C 450 380 435 350 395 320 
             C 350 285 320 245 330 190 
             C 342 135 390 115 435 125 Z" 
          fill="url(#goldStem)"/>

    <!-- Éclat de lumière sur le corps du S -->
    <path d="M 435 125 
             C 400 130 360 160 350 200 
             C 345 220 350 245 365 270 
             C 355 240 355 205 370 175 
             C 390 145 420 135 440 140 Z" 
          fill="url(#goldShine)" opacity="0.75"/>

    <!-- 5. SILHOUETTE BIENVEILLANTE AU CŒUR DU 'S' -->
    <!-- Profil soignant / mère bienveillante -->
    <!-- Chevelure et contour tête -->
    <path d="M 412 150 
             C 430 145 455 155 465 175 
             C 460 178 445 170 425 172 
             C 410 174 400 185 395 198" 
          fill="none" 
          stroke="url(#goldOutline)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- Profil du visage incliné avec douceur -->
    <path d="M 425 172 
             C 435 180 445 192 445 205 
             C 440 215 432 220 422 225 
             C 415 228 410 235 412 245" 
          fill="none" 
          stroke="url(#goldOutline)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>

    <!-- Yeux sereins baissés / sourcil -->
    <path d="M 430 188 
             C 434 192 438 193 442 190" 
          fill="none" 
          stroke="url(#goldOutline)" 
          stroke-width="2" 
          stroke-linecap="round"/>

    <!-- Tête et buste du proche / patient / enfant chéri -->
    <path d="M 445 240 
             C 455 235 470 240 475 255 
             C 478 268 470 280 455 285 
             C 445 288 440 298 442 310" 
          fill="none" 
          stroke="url(#goldOutline)" 
          stroke-width="2.6" 
          stroke-linecap="round"/>

    <!-- Main / bras enveloppant de réconfort -->
    <path d="M 422 250 
             C 438 255 455 265 465 280 
             C 475 295 480 315 475 335" 
          fill="none" 
          stroke="url(#goldOutline)" 
          stroke-width="2.8" 
          stroke-linecap="round"/>

    <!-- 6. FEUILLE / PÉTALE D'OR EN BAS À DROITE -->
    <path d="M 470 340 
             C 490 345 515 375 500 405 
             C 480 395 465 370 470 340 Z" 
          fill="url(#goldSwoosh)"/>
    <path d="M 470 340 
             C 485 360 492 385 498 400" 
          fill="none" 
          stroke="url(#goldStem)" 
          stroke-width="1.8"/>

    <!-- 7. HALO LUMINEUX POINT CHAUD AU SOMMET -->
    <circle cx="435" cy="85" r="30" fill="url(#goldHaloGlow)"/>
  </g>
</svg>