<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 40 380 530" width="100%" height="100%">
  <defs>
    <!-- Dégradés Or Métallique Premium Akeva Sérénité -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6"/>
      <stop offset="20%" stop-color="#E8C37B"/>
      <stop offset="45%" stop-color="#C99856"/>
      <stop offset="75%" stop-color="#9E7227"/>
      <stop offset="100%" stop-color="#6F4D10"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF8D3E"/>
      <stop offset="35%" stop-color="#FDF3CD"/>
      <stop offset="65%" stop-color="#E4BD6E"/>
      <stop offset="100%" stop-color="#9A6E20"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6DFB3"/>
      <stop offset="30%" stop-color="#D9A85F"/>
      <stop offset="70%" stop-color="#B88330"/>
      <stop offset="100%" stop-color="#805615"/>
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)" transform="translate(0, 5)">
    <!-- 1. CERCLE EXTÉRIEUR DU SYMBOLE -->
    <path d="M 260 55 
             A 140 140 0 0 1 455 240 
             A 140 140 0 0 1 390 325" 
          fill="none" stroke="url(#goldLinear)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

    <!-- 2. MONOGRAMME MAJESTUEUX 'AS' -->
    <!-- Fût & Courbe du 'A' -->
    <path d="M 248 88 
             C 255 105 230 150 195 210 
             C 165 260 142 295 142 295 
             L 165 295 
             C 185 260 215 208 245 158 
             C 260 195 290 260 308 295 
             L 332 295 
             C 305 245 268 168 252 88 Z" 
          fill="url(#goldHighlight)"/>

    <!-- Courbe enveloppante de la jambe gauche du 'A' -->
    <path d="M 142 295 
             C 175 285 220 220 260 215 
             C 230 225 195 270 142 295 Z" 
          fill="url(#goldLinear)"/>

    <!-- Ruban fluide du 'S' entrelacé -->
    <path d="M 158 245 
             C 200 210 270 205 320 235 
             C 365 262 398 300 365 345 
             C 335 385 275 375 245 350 
             C 215 325 240 295 265 295 
             C 285 295 298 310 290 328 
             C 282 342 265 348 252 342 
             C 268 355 315 358 338 330 
             C 360 300 338 272 305 252 
             C 260 225 195 228 158 245 Z" 
          fill="url(#goldLinear)"/>

    <!-- Boucle supérieure du 'S' -->
    <path d="M 335 150 
             C 305 138 285 152 285 175 
             C 285 205 320 220 348 242 
             C 370 225 378 190 360 162 
             C 352 152 342 148 335 150 Z" 
          fill="url(#goldHighlight)"/>

    <!-- 3. SILHOUETTE DE BIENVEILLANCE (Mère & Enfant / Soignant & Patient) -->
    <!-- Tête de l'accompagnant -->
    <path d="M 345 142 
             C 338 132 355 118 368 126 
             C 378 134 372 150 360 152 
             C 352 154 348 148 345 142 Z" 
          fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Profil bienveillant penché -->
    <path d="M 342 148 
             C 345 162 360 178 375 185 
             M 358 165 
             C 368 172 382 170 395 165" 
          fill="none" stroke="url(#goldLinear)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Tête du proche accompagné -->
    <circle cx="388" cy="192" r="14" fill="none" stroke="url(#goldLinear)" stroke-width="2.2"/>

    <!-- Petite feuille dorée à droite du S -->
    <path d="M 395 248 
             C 415 252 435 275 430 298 
             C 415 295 398 275 395 248 Z" 
          fill="url(#goldLinear)"/>

    <!-- 4. TEXTE PRINCIPAL 'AKEVA' (Serif Majestueux) -->
    <g transform="translate(300, 395)" text-anchor="middle">
      <text font-family="'Playfair Display', 'Cinzel', 'Trajan Pro', Georgia, serif" 
            font-size="68" 
            font-weight="700" 
            letter-spacing="14" 
            fill="url(#goldText)">AKEVA</text>
    </g>

    <!-- 5. TEXTE 'Sérénité' (Script Calligraphique Raffiné) -->
    <g transform="translate(300, 460)" text-anchor="middle">
      <text font-family="'Caveat', 'Alex Brush', 'Great Vibes', 'Brush Script MT', cursive" 
            font-size="58" 
            font-weight="400" 
            font-style="italic" 
            letter-spacing="2" 
            fill="url(#goldHighlight)">Sérénité</text>
    </g>

    <!-- 6. SÉPARATEUR ORNEMENTAL (Lignes fines + Fleur de Lotus) -->
    <g transform="translate(300, 498)">
      <!-- Ligne gauche -->
      <line x1="-135" y1="0" x2="-25" y2="0" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
      
      <!-- Lotus central à 3 pétales -->
      <!-- Pétale central -->
      <path d="M 0 -12 C -6 -6 -5 4 0 5 C 5 4 6 -6 0 -12 Z" fill="url(#goldHighlight)"/>
      <!-- Pétale gauche -->
      <path d="M -2 3 C -10 -4 -16 2 -12 7 C -7 8 -3 5 -2 3 Z" fill="url(#goldLinear)"/>
      <!-- Pétale droit -->
      <path d="M 2 3 C 10 -4 16 2 12 7 C 7 8 3 5 2 3 Z" fill="url(#goldLinear)"/>
      
      <!-- Ligne droite -->
      <line x1="25" y1="0" x2="135" y2="0" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- 7. SLOGAN OFFICIEL 'UN ENGAGEMENT D'EXCELLENCE POUR VOTRE TRANQUILLITÉ' -->
    <g transform="translate(300, 532)" text-anchor="middle">
      <text font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', sans-serif" 
            font-size="12" 
            font-weight="600" 
            letter-spacing="3.8" 
            fill="url(#goldHighlight)" 
            opacity="0.95">UN ENGAGEMENT D'EXCELLENCE</text>
      <text y="18" 
            font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', sans-serif" 
            font-size="12" 
            font-weight="600" 
            letter-spacing="3.8" 
            fill="url(#goldHighlight)" 
            opacity="0.95">POUR VOTRE TRANQUILLITÉ</text>
    </g>
  </g>
</svg>