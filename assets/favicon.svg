      <stop offset="0%" stop-color="#FFF3CD"/>
      <stop offset="30%" stop-color="#E5BE6C"/>
      <stop offset="60%" stop-color="#C99856"/>
      <stop offset="100%" stop-color="#805615"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F243E"/>
      <stop offset="100%" stop-color="#081729"/>
