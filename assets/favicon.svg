    <path d="M 50 88 C 47 84 48 80 50 78 C 52 80 53 84 50 88 Z" fill="url(#favGold)"/>
    <path d="M 48 85 C 44 82 41 84 43 87 C 46 87 48 86 48 85 Z" fill="url(#favGold)"/>
    <path d="M 52 85 C 56 82 59 84 57 87 C 54 87 52 86 52 85 Z" fill="url(#favGold)"/>
