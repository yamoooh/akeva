  </defs>

  <!-- Fond arrondi premium bleu nuit -->
  <rect width="128" height="128" rx="28" fill="url(#bgDark)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#favGold)" stroke-width="2" opacity="0.6"/>

