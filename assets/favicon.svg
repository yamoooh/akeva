<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dégradé Or Favicon Métallique Lumineux -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFE8A3"/>
      <stop offset="50%" stop-color="#E5BA64"/>
      <stop offset="80%" stop-color="#C58D33"/>
      <stop offset="100%" stop-color="#7A4E0E"/>
    </linearGradient>

    <linearGradient id="favSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C6B1B"/>
      <stop offset="40%" stop-color="#FFF4CE"/>
      <stop offset="70%" stop-color="#E2B45A"/>
      <stop offset="100%" stop-color="#7D4F0D"/>
    </linearGradient>

    <!-- Fond arrondi bleu nuit de luxe -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F243E"/>
      <stop offset="100%" stop-color="#081729"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond arrondi luxueux -->
  <rect width="128" height="128" rx="28" fill="url(#bgDark)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#favGold)" stroke-width="1.8" opacity="0.7"/>

  <!-- Emblème AS Haute Clarté -->
  <g filter="url(#favGlow)" transform="translate(18, 14) scale(0.24)">
    <!-- Halo supérieur -->
    <path d="M 120 40 C 230 0 350 45 375 160 C 395 245 350 330 295 370" 
          fill="none" stroke="url(#favGold)" stroke-width="7" stroke-linecap="round"/>

    <!-- Jambe & sommet A -->
    <path d="M 0 350 L 125 40 L 155 40 L 210 180 C 195 190 175 210 160 230 L 140 100 L 60 350 Z" 
          fill="url(#favGold)"/>

    <!-- Ruban boucle du A -->
    <path d="M 20 280 C 55 220 130 200 190 250 C 255 305 310 370 240 360 C 180 345 120 275 75 255 Z" 
          fill="url(#favSwoosh)"/>

    <!-- Grand S -->
    <path d="M 300 65 L 360 65 L 360 130 C 345 110 325 95 300 90 C 250 80 200 120 190 170 C 180 225 220 270 270 305 C 320 345 340 390 300 425 C 255 460 160 445 130 395 L 150 370 C 180 415 245 425 280 395 C 310 370 290 335 245 300 C 190 260 150 215 165 150 C 180 85 240 60 300 65 Z" 
          fill="url(#favGold)"/>

    <!-- Silhouette bienveillante -->
    <path d="M 270 95 C 290 90 320 105 330 130 C 325 135 305 125 285 127 C 265 130 255 145 250 160" 
          fill="none" stroke="url(#favGold)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 285 127 C 298 138 310 155 310 170 C 300 182 290 188 278 195" 
          fill="none" stroke="url(#favGold)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M 310 215 C 325 208 345 215 350 235 C 355 250 345 265 325 270" 
          fill="none" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round"/>

    <!-- Feuille dorée -->
    <path d="M 340 330 C 365 335 395 370 375 405 C 350 395 335 365 340 330 Z" 
          fill="url(#favSwoosh)"/>
  </g>
</svg>