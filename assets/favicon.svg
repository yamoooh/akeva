    <path d="M 45 6 A 38 38 0 0 1 88 50 A 38 38 0 0 1 72 74" fill="none" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Monogramme AS entrelacé stylisé -->
    <!-- Branche A -->
    <path d="M 42 12 L 20 68 L 29 68 L 36 50 L 52 50 L 58 68 L 68 68 L 48 12 Z" fill="url(#favGold)"/>
    
    <!-- Ruban S entrelacé -->
